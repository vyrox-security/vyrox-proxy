[package]
name = "vyrox-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hmac = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# `subtle` provides timing-safe byte comparisons. Used in `hmac::verify_signature`
# to defeat timing side-channel attacks during signature comparison.
# Pinned to 2.x — API has been stable since 2.0 (2019).
subtle = "2"
# `thiserror` derives `std::error::Error` for our typed error enums. Keeps error
# definitions terse without hand-rolling boilerplate `Display`/`Error` impls.
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
