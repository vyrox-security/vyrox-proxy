[package]
name = "vyrox-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "json"] }
# `axum-server` adds TLS support on top of axum. The `tls-rustls` feature
# pulls in a pure-Rust TLS stack with no OpenSSL dependency — important for
# the static-binary deployment model and for avoiding glibc/openssl ABI hell.
axum-server = { version = "0.7", features = ["tls-rustls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# `dashmap` provides a sharded concurrent HashMap. Used by the nonce store
# in `src/nonce.rs` for lock-free reads and per-shard write locks. We pick
# DashMap over `tokio::sync::RwLock<HashMap>` because the dedup path is
# read-heavy and DashMap scales better under contention.
dashmap = "5"
hmac = "0.12"
hex = "0.4"
# `reqwest` is the HTTP client used by the EDR module to call CrowdStrike
# Falcon. We use the rustls-tls feature to match `axum-server`'s TLS stack
# and avoid pulling in OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `sentry` provides error tracking (T31). The guard returned by `sentry::init`
# is a no-op when no DSN is configured, so dev/CI builds and unconfigured
# deploys send nothing. We disable default features and opt into only the
# panic + backtrace integrations to keep the dependency surface small and
# avoid pulling in a second TLS stack — `rustls` matches axum-server/reqwest.
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sha2 = "0.10"
# `subtle` provides timing-safe byte comparisons. Used in `hmac::verify_signature`
# to defeat timing side-channel attacks during signature comparison.
# Pinned to 2.x — API has been stable since 2.0 (2019).
subtle = "2"
# `thiserror` derives `std::error::Error` for our typed error enums. Keeps error
# definitions terse without hand-rolling boilerplate `Display`/`Error` impls.
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
# `tempfile` powers test fixtures that need a real on-disk audit log.
# Confined to dev-dependencies so it does not bloat the production
# binary.
tempfile = "3"
